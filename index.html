<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>카카오 봉사카드 Ver.1</title>
    <link rel="stylesheet" href="./styles.css?v=20260602-token-reset-2" />
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/v1/kakao.min.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="editor-panel">
        <div class="app-title">
          <span>카카오 봉사카드 Ver.1</span>
          <strong>접속 링크 카드 만들기</strong>
          <button id="refreshVersion" class="version-button" type="button">새 버전 적용</button>
        </div>

        <label>
          <span>삽화 링크</span>
          <input id="imageUrl" type="url" value="" />
        </label>

        <div class="field-group">
          <span>삽화 맞춤</span>
          <div class="segmented-control" role="radiogroup" aria-label="삽화 맞춤">
            <label>
              <input type="radio" name="imageFit" value="contain" checked />
              <span>전체 보이기</span>
            </label>
            <label>
              <input type="radio" name="imageFit" value="cover" />
              <span>가득 채우기</span>
            </label>
          </div>
          <p class="field-note">실제 카톡에서는 정사각형 이미지가 가장 안정적입니다.</p>
        </div>

        <label>
          <span>화면 접속 링크</span>
          <input id="targetUrl" type="url" value="" />
          <small id="targetHint" class="field-note"></small>
        </label>

        <label>
          <span>인사말 박스</span>
          <input id="titleText" maxlength="80" value="" />
        </label>

        <label>
          <span>주제 박스</span>
          <textarea id="descriptionText" maxlength="160"></textarea>
        </label>

        <label>
          <span>버튼 박스</span>
          <input id="buttonText" maxlength="40" value="버튼을 눌러 자세히 알아보세요" />
        </label>

        <p id="sendStatus" class="status-text" role="status"></p>
      </section>

      <section class="preview-panel" aria-label="카드 미리보기">
        <div class="preview-stack">
          <div class="phone-frame">
            <article class="kakao-card">
              <div id="previewImageStage" class="image-stage">
                <img id="previewImage" class="card-image" alt="" />
              </div>
              <div class="card-body">
                <h1 id="previewTitle"></h1>
                <p id="previewDescription"></p>
                <a id="previewButton" class="card-button" href="#" target="_blank" rel="noreferrer"></a>
                <div class="card-footer">
                  <span class="app-icon">APP</span>
                  <span id="previewSite"></span>
                  <span class="arrow">›</span>
                </div>
              </div>
            </article>
          </div>

          <div class="actions">
            <button id="sendToMe" class="kakao-button" type="button">내 카톡으로 전송</button>
            <button id="shareKakao" class="share-button" type="button">카톡 공유하기</button>
          </div>
        </div>
      </section>
    </main>
    <script src="./app.js?v=20260602-token-reset-2"></script>
  </body>
</html>
